name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build Bubblewrap Project
        run: |
          # Clear any preset paths so Bubblewrap downloads its own perfectly compatible JDK & SDK
          unset JAVA_HOME
          unset ANDROID_HOME
          rm -rf ~/.bubblewrap
          
          mkdir apk-build
          cd apk-build
          
          echo '{
            "packageId": "com.iiitbh.attendance",
            "host": "iiitbh-ams.vercel.app",
            "name": "IIIT Bhagalpur Attendance",
            "launcherName": "Attendance",
            "display": "standalone",
            "themeColor": "#2563eb",
            "navigationColor": "#ffffff",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#ffffff",
            "startUrl": "/",
            "iconUrl": "https://iiitbh-ams.vercel.app/icon-512x512.png",
            "maskableIconUrl": "https://iiitbh-ams.vercel.app/icon-512x512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://iiitbh-ams.vercel.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": false,
            "saveAndroidProject": true
          }' > twa-manifest.json
          
          # Use a standard PKCS12 keystore compatible with modern Java
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=IIIT, OU=IT, O=IIIT, L=Bhagalpur, ST=Bihar, C=IN"
          
          # Create an Expect script to gracefully handle ALL interactive prompts from Bubblewrap
          cat << 'EXP' > build.exp
          set timeout -1
          spawn bubblewrap build
          expect {
            -nocase "install the jdk" {
              send "y\r"
              exp_continue
            }
            -nocase "install the android sdk tools" {
              send "y\r"
              exp_continue
            }
            -nocase "terms and conditions" {
              send "y\r"
              exp_continue
            }
            -nocase "password for the key store" {
              send "password123\r"
              exp_continue
            }
            -nocase "password for the key" {
              send "password123\r"
              exp_continue
            }
            eof
          }
          EXP
          
          # Run the expect script and capture output for debugging
          expect build.exp > bubblewrap_build.log 2>&1 || true
          
          if [ ! -f "app-release-signed.apk" ]; then
            ERROR_LOG=$(cat bubblewrap_build.log | tr '\n' ' ' | sed 's/"/'\''/g')
            echo "::error::BUBBLEWRAP_ERROR_LOG: $ERROR_LOG"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-App-Signed-APK
          path: apk-build/app-release-signed.apk
          
