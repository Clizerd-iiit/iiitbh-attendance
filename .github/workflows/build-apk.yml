name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y expect wget unzip

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Download & Setup Perfect Android SDK
        run: |
          # Bubblewrap requires a very specific Android SDK structure (cmdline-tools/latest/bin/sdkmanager)
          # Instead of fighting the pre-installed one, we download a fresh, perfectly formatted one.
          mkdir -p /tmp/android-sdk/cmdline-tools
          cd /tmp/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          unzip -q commandlinetools-linux-*
          rm commandlinetools-linux-*.zip
          mv cmdline-tools latest
          
          # Accept all Android licenses automatically
          yes | /tmp/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/tmp/android-sdk --licenses
          
          # Pre-install what Bubblewrap needs so it doesn't try to download them and hang
          /tmp/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/tmp/android-sdk "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          
          # Configure Bubblewrap to use our fresh, perfect SDK
          mkdir -p ~/.bubblewrap
          cat << CONF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "/tmp/android-sdk"
          }
          CONF

      - name: Build TWA Project
        run: |
          mkdir apk-build
          cd apk-build
          
          cat << 'MANIFEST' > twa-manifest.json
          {
            "packageId": "com.iiitbh.attendance",
            "host": "iiitbh-ams.vercel.app",
            "name": "IIIT Bhagalpur Attendance",
            "launcherName": "Attendance",
            "display": "standalone",
            "themeColor": "#2563eb",
            "navigationColor": "#ffffff",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#ffffff",
            "startUrl": "/",
            "iconUrl": "https://iiitbh-ams.vercel.app/icon-512x512.png",
            "maskableIconUrl": "https://iiitbh-ams.vercel.app/icon-512x512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://iiitbh-ams.vercel.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": false,
            "saveAndroidProject": true
          }
          MANIFEST
          
          # Create keystore
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=IIIT, OU=IT, O=IIIT, L=Bhagalpur, ST=Bihar, C=IN" -deststoretype JKS
          
          # Run bubblewrap with expect to handle keystore passwords
          cat << 'EXP' > build.exp
          set timeout -1
          spawn bubblewrap build
          expect {
            -nocase "password for the key store" {
              send "password123\r"
              exp_continue
            }
            -nocase "password for the key" {
              send "password123\r"
              exp_continue
            }
            eof
          }
          EXP
          
          expect build.exp > build.log 2>&1 || true
          
          if [ ! -f "app-release-signed.apk" ]; then
            echo "::error::BUBBLEWRAP_ERROR_LOG: $(cat build.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-App-Signed-APK
          path: apk-build/app-release-signed.apk
          
