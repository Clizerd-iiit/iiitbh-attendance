name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build Bubblewrap Project
        run: |
          mkdir apk-build
          cd apk-build
          
          echo '{
            "packageId": "com.iiitbh.attendance",
            "host": "iiitbh-ams.vercel.app",
            "name": "IIIT Bhagalpur Attendance",
            "launcherName": "Attendance",
            "display": "standalone",
            "themeColor": "#2563eb",
            "navigationColor": "#ffffff",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#ffffff",
            "startUrl": "/",
            "iconUrl": "https://iiitbh-ams.vercel.app/icon-512x512.png",
            "maskableIconUrl": "https://iiitbh-ams.vercel.app/icon-512x512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://iiitbh-ams.vercel.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": false,
            "saveAndroidProject": true
          }' > twa-manifest.json
          
          # Generate a signing keystore automatically
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=IIIT, OU=IT, O=IIIT, L=Bhagalpur, ST=Bihar, C=IN"
          
          # Install expect to script the interactive prompts of bubblewrap
          sudo apt-get update && sudo apt-get install -y expect
          
          cat << 'EXPECT_SCRIPT' > build.exp
          set timeout -1
          spawn bubblewrap build --skipVersionCheck
          
          expect {
            -nocase "install the jdk" {
              send "n\r"
              exp_continue
            }
            -nocase "install the android sdk" {
              send "n\r"
              exp_continue
            }
            -nocase "agree to the" {
              send "y\r"
              exp_continue
            }
            -nocase "password" {
              send "password123\r"
              exp_continue
            }
            -nocase "path to the jdk" {
              send "$env(JAVA_HOME)\r"
              exp_continue
            }
            -nocase "path to the android sdk" {
              send "$env(ANDROID_HOME)\r"
              exp_continue
            }
            -nocase "update" {
              send "y\r"
              exp_continue
            }
            eof
          }
          EXPECT_SCRIPT
          
          expect build.exp

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-App-Signed-APK
          path: apk-build/app-release-signed.apk
