name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Fix Android SDK for Bubblewrap (Ultimate Bypass)
        run: |
          # Bubblewrap has a strict internal check that looks exclusively for 'cmdline-tools/latest/bin/sdkmanager'.
          # Because GitHub Actions uses a different versioned folder structure, Bubblewrap constantly rejects it.
          # We bypass this entirely by creating a dummy file at the exact path Bubblewrap checks!
          # This forces Bubblewrap to accept the pre-installed, fully functional GitHub SDK.
          mkdir -p $ANDROID_HOME/cmdline-tools/latest/bin
          touch $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          chmod +x $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          
          mkdir -p $ANDROID_HOME/tools/bin
          touch $ANDROID_HOME/tools/bin/sdkmanager
          chmod +x $ANDROID_HOME/tools/bin/sdkmanager
          
          # Configure Bubblewrap to use the bypassed SDK and standard JDK
          mkdir -p ~/.bubblewrap
          cat << CONF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          CONF

      - name: Build TWA Project
        run: |
          mkdir apk-build
          cd apk-build
          
          cat << 'MANIFEST' > twa-manifest.json
          {
            "packageId": "com.iiitbh.attendance",
            "host": "iiitbh-ams.vercel.app",
            "name": "IIIT Bhagalpur Attendance",
            "launcherName": "Attendance",
            "display": "standalone",
            "themeColor": "#2563eb",
            "navigationColor": "#ffffff",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#ffffff",
            "startUrl": "/",
            "iconUrl": "https://iiitbh-ams.vercel.app/icon-512x512.png",
            "maskableIconUrl": "https://iiitbh-ams.vercel.app/icon-512x512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://iiitbh-ams.vercel.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": false,
            "saveAndroidProject": true
          }
          MANIFEST
          
          # Create a modern JKS keystore
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=IIIT, OU=IT, O=IIIT, L=Bhagalpur, ST=Bihar, C=IN" -deststoretype JKS
          
          # Use expect just for the keystore passwords
          cat << 'EXP' > build.exp
          set timeout -1
          spawn bubblewrap build
          expect {
            -nocase "password for the key store" {
              send "password123\r"
              exp_continue
            }
            -nocase "password for the key" {
              send "password123\r"
              exp_continue
            }
            eof
          }
          EXP
          
          expect build.exp > build.log 2>&1 || true
          
          if [ ! -f "app-release-signed.apk" ]; then
            echo "::error::BUBBLEWRAP_ERROR_LOG: $(cat build.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-App-Signed-APK
          path: apk-build/app-release-signed.apk
          
