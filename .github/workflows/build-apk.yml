name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install and Configure Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          mkdir -p out
          echo "<html><body>Loading...</body></html>" > out/index.html
          
          npx cap init Attendance com.iiitbh.attendance --web-dir out
          
          # Delete the default TS config that overrides our custom JSON config
          rm -f capacitor.config.ts
          
          # Configure Capacitor to load the live URL and spoof the User Agent
          # Spoofing the User-Agent removes the "; wv" (WebView) flag, which tricks Google OAuth into allowing logins
          cat << 'CONF' > capacitor.config.json
          {
            "appId": "com.iiitbh.attendance",
            "appName": "Attendance",
            "webDir": "out",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://iiitbh-ams.vercel.app",
              "cleartext": true
            },
            "android": {
              "overrideUserAgent": "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Mobile Safari/537.36"
            }
          }
          CONF
          
          npx cap add android
          npx cap sync android

      - name: Inject Camera Permissions
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIDEO_CAPTURE" />\n    <uses-permission android:name="android.permission.AUDIO_CAPTURE" />\n</manifest>|g' $MANIFEST_PATH
          
          cat << 'JAVA' > android/app/src/main/java/com/iiitbh/attendance/MainActivity.java
          package com.iiitbh.attendance;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = this.bridge.getWebView();
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });
              }
          }
          JAVA

      - name: Resolve Kotlin Duplicate Class Errors
        run: |
          cat << 'GRADLE_FIX' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          GRADLE_FIX

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=IIIT, OU=IT, O=IIIT, L=Bhagalpur, ST=Bihar, C=IN"
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          $BUILD_TOOLS_DIR/zipalign -v -p 4 $APK_PATH app-release-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks android.keystore --ks-pass pass:password123 --key-pass pass:password123 --out app-release-signed.apk app-release-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-App-Signed-APK
          path: app-release-signed.apk
          
