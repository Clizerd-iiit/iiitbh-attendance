name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Fix Android SDK for Bubblewrap (Ultimate Bypass)
        run: |
          sudo mkdir -p $ANDROID_HOME/cmdline-tools/latest/bin
          echo '#!/bin/bash' | sudo tee $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          echo 'exit 0' | sudo tee -a $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          sudo chmod +x $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          
          sudo mkdir -p $ANDROID_HOME/tools/bin
          echo '#!/bin/bash' | sudo tee $ANDROID_HOME/tools/bin/sdkmanager
          echo 'exit 0' | sudo tee -a $ANDROID_HOME/tools/bin/sdkmanager
          sudo chmod +x $ANDROID_HOME/tools/bin/sdkmanager
          
          mkdir -p ~/.bubblewrap
          cat << CONF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          CONF

      - name: Build TWA Project
        run: |
          mkdir apk-build
          cd apk-build
          
          cat << 'MANIFEST' > twa-manifest.json
          {
            "packageId": "com.iiitbh.attendance",
            "host": "iiitbh-ams.vercel.app",
            "name": "IIIT Bhagalpur Attendance",
            "launcherName": "Attendance",
            "display": "standalone",
            "themeColor": "#2563eb",
            "navigationColor": "#ffffff",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#ffffff",
            "startUrl": "/",
            "iconUrl": "https://iiitbh-ams.vercel.app/icon-512x512.png",
            "maskableIconUrl": "https://iiitbh-ams.vercel.app/icon-512x512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://iiitbh-ams.vercel.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": false,
            "saveAndroidProject": true
          }
          MANIFEST
          
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=IIIT, OU=IT, O=IIIT, L=Bhagalpur, ST=Bihar, C=IN" -deststoretype JKS
          
          # We use a state-machine expect script to handle optional prompts, 
          # prevent infinite repaint loops, and avoid hanging indefinitely.
          cat << 'EXP' > build.exp
          set timeout 300
          spawn bubblewrap build
          
          set regen_done 0
          set keystore_done 0
          set key_done 0
          
          expect {
              -nocase "regenerate your project" {
                  if {$regen_done == 0} {
                      set regen_done 1
                      send "no\r"
                  }
                  exp_continue
              }
              -nocase "password for the key store" {
                  if {$keystore_done == 0} {
                      set keystore_done 1
                      send "password123\r"
                  }
                  exp_continue
              }
              -nocase "password for the key" {
                  if {$key_done == 0} {
                      set key_done 1
                      send "password123\r"
                  }
                  exp_continue
              }
              timeout {
                  puts "\n[EXPECT TIMEOUT]: Build hung for 5 minutes without expected prompt."
                  exit 1
              }
              eof {
                  puts "\n[EXPECT SUCCESS]: Build finished."
                  exit 0
              }
          }
          EXP
          
          expect build.exp > build.log 2>&1 || true
          
          if [ ! -f "app-release-signed.apk" ]; then
            echo "::error::BUBBLEWRAP_ERROR_LOG: $(cat build.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-App-Signed-APK
          path: apk-build/app-release-signed.apk
          
